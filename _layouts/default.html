<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | Bryan Ramos-Morales
    {% else %}
      Bryan Ramos-Morales | Portfolio
    {% endif %}
  </title>

  <link
    rel="stylesheet"
    href="{{ '/assets/css/site.css' | relative_url }}"
  >
</head>

<body>
  <div class="site-shell">

    <aside class="sidebar">
      <a class="brand" href="{{ '/' | relative_url }}">
        BRYAN RAMOS-<br>MORALES
      </a>

      <nav aria-label="Main navigation">

        <div class="nav-group">
          <div class="nav-title">Main</div>

          <a
            class="{% if page.url == '/' %}active{% endif %}"
            href="{{ '/' | relative_url }}"
          >
            Home
          </a>
        </div>

        <div class="nav-group">
          <div class="nav-title">Portfolio</div>

          <a
            class="{% if page.section == 'cultural-resources' %}active{% endif %}"
            href="{{ '/cultural-resources.html' | relative_url }}"
          >
            Cultural Resources &amp; NAGPRA
          </a>

          <a
            class="{% if page.section == 'geography' %}active{% endif %}"
            href="{{ '/geography-spatial-analysis.html' | relative_url }}"
          >
            Geography &amp; Spatial Analysis
          </a>

          <a
            class="{% if page.section == 'environmental' %}active{% endif %}"
            href="{{ '/environmental-geography.html' | relative_url }}"
          >
            Environmental Geography
          </a>

          <a
            class="{% if page.section == 'data' %}active{% endif %}"
            href="{{ '/data-programming.html' | relative_url }}"
          >
            Data &amp; Programming
          </a>
        </div>

        <div class="nav-group">
          <div class="nav-title">Profile</div>

          <a href="{{ '/professional-experience.html' | relative_url }}">
            Professional Experience
          </a>

          <a href="{{ '/about.html' | relative_url }}">
            About
          </a>

          <a href="{{ '/resume.html' | relative_url }}">
            Résumé
          </a>

          <a href="{{ '/contact.html' | relative_url }}">
            Contact
          </a>
        </div>

      </nav>
    </aside>

    <main class="site-main">
      <div class="content-wrap">
        {{ content }}

        <footer class="site-footer">
          © 2026 Bryan Ramos-Morales
        </footer>
      </div>
    </main>

  </div>
</body>
</html>
